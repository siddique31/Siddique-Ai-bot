<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siddique AI Chat Bot</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: {
        primaryColor: '#dbeafe',
        primaryBorderColor: '#1e3a8a',
        primaryTextColor: '#1e3a8a',
        lineColor: '#1e3a8a',
        fontSize: '14px'
      }
    });
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0f4f8 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: white;
      padding: 18px 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .header h1 { font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .header .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .header p { margin-top: 6px; font-size: 12px; opacity: 0.85; }
    .tagline { font-size: 11px; background: rgba(255,255,255,0.15); padding: 3px 10px; border-radius: 12px; display: inline-block; margin-top: 6px; }

    #chat {
      flex: 1;
      max-width: 820px;
      width: 100%;
      margin: 16px auto;
      background: white;
      border-radius: 14px;
      padding: 16px;
      overflow-y: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      min-height: 50vh;
    }
    .msg {
      margin: 12px 0;
      padding: 12px 14px;
      border-radius: 12px;
      max-width: 85%;
      word-wrap: break-word;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from{opacity:0; transform:translateY(5px)} to{opacity:1; transform:translateY(0)} }
    .user {
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }
    .bot {
      background: #f3f4f6;
      color: #1f2937;
      border-bottom-left-radius: 4px;
      border-left: 3px solid #3b82f6;
    }
    .disclaimer { font-size: 11px; color: #b45309; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #fbbf24; }
    .mermaid { background: white; padding: 12px; border-radius: 8px; margin-top: 10px; text-align: center; overflow-x: auto; }
    img.chat-img { max-width: 320px; width: 100%; border-radius: 10px; margin-top: 10px; display: block; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

    #inputBox {
      max-width: 820px;
      width: 100%;
      margin: 0 auto 18px;
      display: flex;
      gap: 8px;
      padding: 0 12px;
    }
    #userInput {
      flex: 1;
      padding: 14px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }
    #userInput:focus { border-color: #3b82f6; }
    #sendBtn {
      padding: 14px 24px;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.15s, opacity 0.15s;
    }
    #sendBtn:hover { transform: translateY(-1px); }
    #sendBtn:disabled { opacity: 0.6; cursor: not-allowed; }
    .typing { color: #6b7280; font-style: italic; }
    .typing::after { content: '...'; animation: dots 1.2s infinite; }
    @keyframes dots { 0%,20%{content:'.'} 40%{content:'..'} 60%,100%{content:'...'} }
  </style>
</head>
<body>
  <div class="header">
    <h1><span class="dot"></span> Siddique AI Chat Bot</h1>
    <p>Medical & Veterinary Information Assistant</p>
    <span class="tagline">Not a Doctor • General Info Only</span>
  </div>

  <div id="chat"></div>

  <div id="inputBox">
    <input id="userInput" placeholder="Sawal likho... (e.g. kidney ka diagram banao)"
           onkeypress="if(event.key==='Enter' && !event.shiftKey) sendMsg()" />
    <button id="sendBtn" onclick="sendMsg()">Send ➤</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const sendBtn = document.getElementById('sendBtn');
    let mermaidCounter = 0;

    function addMsg(text, cls) {
      const d = document.createElement('div');
      d.className = 'msg ' + cls;
      d.textContent = text;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
      return d;
    }

    function addDisclaimer(parent, text) {
      if (!text) return;
      const dis = document.createElement('div');
      dis.className = 'disclaimer';
      dis.textContent = text;
      parent.appendChild(dis);
    }

    async function sendMsg() {
      const input = document.getElementById('userInput');
      const msg = input.value.trim();
      if (!msg) return;
      addMsg(msg, 'user');
      input.value = '';
      sendBtn.disabled = true;

      const botDiv = addMsg('Siddique AI soch raha hai', 'bot typing');

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message: msg})
        });
        const data = await res.json();
        botDiv.classList.remove('typing');
        botDiv.textContent = '';

        if (data.type === 'text' || data.type === 'refuse') {
          botDiv.textContent = data.answer;
        }
        else if (data.type === 'diagram') {
          const wrap = document.createElement('div');
          wrap.className = 'mermaid';
          wrap.id = 'm' + (++mermaidCounter);
          // textContent use karo taake <br> real HTML na bane
          wrap.textContent = data.code;
          botDiv.appendChild(wrap);
          try {
            await mermaid.run({nodes: [wrap]});
          } catch (err) {
            wrap.textContent = 'Diagram render error. Code:\n' + data.code;
          }
          addDisclaimer(botDiv, data.disclaimer);
        }
        else if (data.type === 'image') {
          const img = document.createElement('img');
          img.src = data.url;
          img.className = 'chat-img';
          img.alt = 'Generated image';
          img.onerror = () => { img.alt = 'Image load nahi hui'; };
          botDiv.appendChild(img);
          addDisclaimer(botDiv, data.disclaimer);
        }
        else {
          botDiv.textContent = data.answer || 'Koi jawab nahi mila.';
        }
      } catch (e) {
        botDiv.classList.remove('typing');
        botDiv.textContent = 'Error: ' + e.message;
      } finally {
        sendBtn.disabled = false;
        chat.scrollTop = chat.scrollHeight;
      }
    }
  </script>
</body>
</html>
